name: Validate PaperStudio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install XeLaTeX and document fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra texlive-pictures fonts-noto-core fonts-lmodern poppler-utils
      - run: npm ci
      - run: npm run build
      - run: npm test
